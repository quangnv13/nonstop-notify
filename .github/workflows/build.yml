name: Build

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            artifactPath: target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
            artifactPath: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libasound2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --prefix ui-react --ignore-scripts

      - name: Audit dependency licenses
        run: node scripts/check-licenses.mjs

      - name: Build frontend
        run: npm --prefix ui-react run build

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check Windows installer PATH integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-installer-path.ps1

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Smoke test installed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows-installer.ps1 -InstallerPath (Get-ChildItem target/release/bundle/nsis -Filter '*.exe').FullName

      - name: Upload bundles
        id: upload-bundles
        uses: actions/upload-artifact@v4
        with:
          name: nonstop-notify-${{ matrix.name }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14

      - name: Record Windows unsigned bundle artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Windows unsigned bundle artifact ID: ${{ steps.upload-bundles.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          pattern: nonstop-notify-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nonstop Notify ${GITHUB_REF_NAME#v}" \
            --notes "[Code Signing Policy](https://github.com/${GITHUB_REPOSITORY}#code-signing-policy)" \
            --generate-notes \
            --verify-tag
